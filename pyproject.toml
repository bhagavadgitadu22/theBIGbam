[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "thebigbam"
dynamic = ["version"]
description = "Compression and interactive exploration of large-scale sequencing alignments with circular mapping support"
readme = "README.md"
authors = [{ name = "Martin Boutroux", email = "martinboutroux@outlook.fr" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

dependencies = [
    "bokeh>=3.8,<3.10",
    "panel>=1.8,<1.10",
    "param>=2.3,<2.5",
    "biopython>=1.79",
    "pysam>=0.20",
    "dna-features-viewer>=1.0",
    "duckdb>=1.0",
    "zstandard>=0.19",
]

[project.urls]
Homepage = "https://github.com/bhagavadgitadu22/theBIGbam"
Repository = "https://github.com/bhagavadgitadu22/theBIGbam"
Issues = "https://github.com/bhagavadgitadu22/theBIGbam/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.12",
    "maturin>=1.4",
    "playwright>=1.40,<2",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
thebigbam = "thebigbam.cli:main"

[tool.maturin]
# Build with the "python" feature enabled for PyO3 bindings
features = ["python"]
# Module name for the Rust extension (separate from the Python package)
module-name = "thebigbam_rs"
# Explicitly include the Python package
python-packages = ["thebigbam"]
